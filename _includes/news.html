
<div class="well">
<h4>News</h4>

<div class="news-items">
{% for article in site.data.news limit:4 %}
<div class="news-item"><b>{{ article.date }}</b>: {{ article.headline | markdownify }}</div>
{% endfor %}
</div>

<p class="news-more"><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">... see all News</a></p>

</div>
